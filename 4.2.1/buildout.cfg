[buildout]
index = https://pypi.python.org/simple/
extends =
  buildout-base.cfg
extensions = mr.developer

var-dir=/data
user=admin:admin

effective-user = senaite
buildout-user = senaite

eggs-directory=eggs
download-cache=../buildout-cache/downloads

parts +=
  zeo
  plonesite
  console_scripts

eggs +=
    senaite.lims
    senaite.storage
    senaite.instruments
    bika.ui
    bika.coa
    bika.extras
    bika.reports
    senaite.crms
    senaite.sampleimporter
    senaite.samplepointlocations
    senaite.timeseries
    bika.wine
    senaite.receivedemail
    senaite.batch.invoices

sources = sources
auto-checkout = *

[sources]
bika.coa = git https://github.com/bikalims/bika.coa.git rev=c98e1cdbdc85b844575f21a12314ba3e912e705a
bika.extras = git https://github.com/bikalims/bika.extras.git rev=f3978eb7bedc49cbd5beac134ecc697a286c561d
bika.reports = git https://github.com/bikalims/bika.reports.git rev=112b788fc5e26d1fee0d82db27f9ae3d3e66325d
bika.ui = git https://github.com/bikalims/bika.ui.git rev=2607802fc9a149bcd359f157f69bb44899c828ba
bika.wine = git https://github.com/bikalims/bika.wine.git rev=65a40f5a5b27fdf4259c94112d0670572a2e4dfc
senaite.app.listing = git https://github.com/bikalims/senaite.app.listing.git rev=d560328ab128603f81dcbbe92c2f643d3a41c4fb
senaite.app.spotlight = git https://github.com/senaite/senaite.app.spotlight.git rev=6212658fbafae22d1f74dee5ca1e1745098af0b4
senaite.app.supermodel = git https://github.com/senaite/senaite.app.supermodel.git rev=03cc81a7d799135d19676129d30a8ca6512777a8
senaite.batch.invoices = git https://github.com/bikalims/senaite.batch.invoices.git rev=3a5779538b7044956a3b5c7fcebabdf532e53aa3
senaite.core = git https://github.com/senaite/senaite.core.git rev=a7f0a07c3b426935640c357d7598d0e84b8624d2
senaite.crms = git https://github.com/bikalims/senaite.crms.git rev=3ebec8b8a51fb0c2b8f88f22948cfcec481254c1
senaite.impress = git https://github.com/senaite/senaite.impress.git rev=01d5380aa1e574e27c843536bd04d4df3e2b32d8
senaite.instruments = git https://github.com/bikalims/senaite.instruments.git rev=0c64938ff9f8b5d0bdc82fe7c821c425f4061901
senaite.jsonapi = git https://github.com/senaite/senaite.jsonapi.git rev=0139af663f23c773dff5e4c4367ac5a47a44c9d8
senaite.lims = git https://github.com/senaite/senaite.lims.git rev=0e487baf128dbfd9444048334ffa6f176b0dd8d2
senaite.receivedemail = git https://github.com/bikalims/senaite.receivedemail.git rev=7d6b4b12fb86aad5625ccab2290c2e20e06084ec
senaite.sampleimporter = git https://github.com/bikalims/senaite.sampleimporter.git rev=b2b860a27e590255971d4ba4f3413c0807f78444
senaite.samplepointlocations = git https://github.com/bikalims/senaite.samplepointlocations.git rev=eb2e0066ae2c5234b2484eda94f76fb608ff5550
senaite.storage = git https://github.com/senaite/senaite.storage.git rev=7c1c7e5e5d130422c2f73725930fdbdd21312ade

senaite.timeseries = git https://github.com/bikalims/senaite.timeseries.git rev=73673da3ca6c1e1d662942ac152fa9271b61cefa

[client1]
recipe =

[zeo]
<= zeoserver_base
recipe = plone.recipe.zeoserver
zeo-address = 8080

[instance]
# taken from https://github.com/plone/plone.docker/blob/master/5.2/5.2.5/python2/buildout.cfg
event-log-handler = StreamHandler
event-log-args = (sys.stderr,)
access-log-handler = StreamHandler
access-log-args = (sys.stdout,)

[console_scripts]
recipe = zc.recipe.egg:scripts
eggs = senaite.core

[plonesite]
recipe = collective.recipe.plonesite
instance = instance
site-id = senaite
profiles-initial = Products.CMFPlone:dependencies
profiles =
    senaite.lims:default
upgrade-portal = False
upgrade-all-profiles = False
enabled = False

[versions]
setuptools =
zc.buildout =
et-xmlfile = 1.0.1
